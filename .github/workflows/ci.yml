name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qaryati
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: qaryati_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qaryati"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: qaryati
      DB_PASSWORD: ci-password
      DB_NAME: qaryati_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - run: docker build -t qaryati-api .
